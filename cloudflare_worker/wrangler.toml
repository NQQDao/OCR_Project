name = "ocr-r2-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare R2 Bucket
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "ocr-vn01"

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ocr"
database_id = "00c15f36-f7cb-40e4-b0a8-a5b9b862bd3c"

# Rules for importing HTML as text
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[placement]
mode = "targeted"
region = "aws:us-east-1"

[vars]
AI_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-2.5-flash"
GEMINI_FALLBACK_MODELS = "gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.5-pro,gemini-2.0-flash"
R2_BUCKET_NAME = "ocr-vn01"
SESSION_DURATION_SECONDS = "86400"
AUTH_SECRET = "ocr_wood_secure_hmac_secret_key_2026_default_salt_xyz987"
