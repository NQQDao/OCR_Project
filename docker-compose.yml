version: "3.8"

services:
  # Dịch vụ Cơ sở dữ liệu PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: ocr_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123321}
      POSTGRES_DB: ocr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dịch vụ Web App OCR
  web:
    build: .
    container_name: ocr_web_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-123321}@db:5432/ocr_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-ocr-vn01}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    volumes:
      - ./output:/app/output
      - ./web_uploads:/app/web_uploads
      - ./excel_exports:/app/excel_exports
      - ./abbreviations.json:/app/abbreviations.json
      - ./ocr_data.db:/app/ocr_data.db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
